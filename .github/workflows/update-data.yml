name: Update A&E data

on:
  schedule:
    # Wednesdays at 06:17 UTC. Public Health Scotland publishes weekly (on
    # Tuesdays); NHS England publishes monthly, on the second Thursday.
    - cron: "17 6 * * 3"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 1

      # Temporary: shows what GitHub's servers get from an NHS England index
      # page, to find out why no England files were found. Remove once fixed.
      - name: Check access to NHS England pages
        run: |
          url="https://www.england.nhs.uk/statistics/statistical-work-areas/ae-waiting-times-and-activity/ae-attendances-and-emergency-admissions-2025-26/"
          echo "--- curl"
          curl -sS -L -o page.html -w "HTTP %{http_code}, %{size_download} bytes, final URL %{url_effective}\n" "$url" || true
          echo "Lines mentioning xls: $(grep -c xls page.html || true)"
          head -c 800 page.html; echo
          echo "--- R"
          Rscript -e 'cat("HTTPUserAgent:", getOption("HTTPUserAgent"), "\n"); x <- tryCatch(readLines(url(commandArgs(TRUE)[1])), error = function(e) {cat("Error:", conditionMessage(e), "\n"); character()}); cat(length(x), "lines,", sum(grepl("xls", x)), "mention xls\n"); cat(head(x, 8), sep = "\n")' "$url"

      - name: Scrape and check the data
        run: Rscript update.R

      # Runs even if one country failed, so the other is still saved. The job
      # is still marked as failed, and GitHub emails you about it.
      - name: Commit any changes
        if: success() || failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes to the data."
          else
            git commit -m "Update A&E data $(date -u +%Y-%m-%d)"
            git push
          fi
