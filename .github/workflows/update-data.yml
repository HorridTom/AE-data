name: Update A&E data

on:
  schedule:
    # Wednesdays at 06:17 UTC. Public Health Scotland publishes weekly (on
    # Tuesdays); NHS England publishes monthly, on the second Thursday.
    - cron: "17 6 * * 3"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 1

      - name: Scrape and check the data
        run: Rscript update.R

      # Runs even if one country failed, so the other is still saved. The job
      # is still marked as failed, and GitHub emails you about it.
      - name: Commit any changes
        if: success() || failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes to the data."
          else
            git commit -m "Update A&E data $(date -u +%Y-%m-%d)"
            git push
          fi
